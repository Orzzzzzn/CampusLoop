services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${HEKY_PORT:-8010}:8000"
    environment:
      HOST: "0.0.0.0"
      DATABASE_PATH: "/app/data/heky.sqlite3"
      DEMO_MODE: "${DEMO_MODE:-1}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-heky-local-2026}"
      STUDENT_DOMAINS: "${STUDENT_DOMAINS:-usc.edu}"
      GEOCODER_URL: "${GEOCODER_URL:-https://photon.komoot.io/api/}"
      ROUTER_URL: "${ROUTER_URL:-https://router.project-osrm.org/route/v1/driving}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      OLLAMA_URL: "http://ollama:11434"
      # 0.5b keeps CPU answers usable; set CHAT_MODEL=qwen2.5:1.5b for higher quality.
      CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:0.5b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text:v1.5}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
      RAG_SEMANTIC: "${RAG_SEMANTIC:-0}"
      RAG_WARMUP: "${RAG_WARMUP:-1}"
      RAG_NUM_PREDICT: "${RAG_NUM_PREDICT:-140}"
      RAG_NUM_CTX: "${RAG_NUM_CTX:-1024}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM:-campusloop@localhost}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-1}"
    volumes:
      - heky_data:/app/data
      - ./knowledge:/app/knowledge:ro
    depends_on:
      ollama:
        condition: service_healthy
      model-init:
        condition: service_completed_successfully
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
      # Keep chat/embed weights loaded so the first browser ask is not a cold start.
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:--1}"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped
  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:0.5b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text:v1.5}"
      RAG_NUM_CTX: "${RAG_NUM_CTX:-1024}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Pulling chat model $$CHAT_MODEL…"
        ollama pull "$$CHAT_MODEL"
        echo "Pulling embed model $$EMBED_MODEL…"
        ollama pull "$$EMBED_MODEL"
        echo "Warming chat model (same context size as the app)…"
        ollama run "$$CHAT_MODEL" "ping" --keepalive 24h </dev/null >/dev/null 2>&1 || true
        echo "Models ready."
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
volumes:
  heky_data:
  ollama_models:
