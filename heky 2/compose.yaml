services:
  app:
    build: .
    init: true
    ports:
      - "127.0.0.1:${HEKY_PORT:-8010}:8000"
    environment:
      HOST: "0.0.0.0"
      DATABASE_PATH: "/app/data/heky.sqlite3"
      DEMO_MODE: "${DEMO_MODE:-1}"
      DEMO_PASSWORD: "${DEMO_PASSWORD:-heky-local-2026}"
      STUDENT_DOMAINS: "${STUDENT_DOMAINS:-usc.edu}"
      GEOCODER_URL: "${GEOCODER_URL:-https://photon.komoot.io/api/}"
      COOKIE_SECURE: "${COOKIE_SECURE:-0}"
      OLLAMA_URL: "http://ollama:11434"
      CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:1.5b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text:v1.5}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_FROM: "${SMTP_FROM:-campusloop@localhost}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_STARTTLS: "${SMTP_STARTTLS:-1}"
    volumes:
      - heky_data:/app/data
      - ./knowledge:/app/knowledge:ro
    depends_on:
      ollama:
        condition: service_healthy
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 10s
    restart: unless-stopped
  model-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: "http://ollama:11434"
      CHAT_MODEL: "${CHAT_MODEL:-qwen2.5:1.5b}"
      EMBED_MODEL: "${EMBED_MODEL:-nomic-embed-text:v1.5}"
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$CHAT_MODEL" && ollama pull "$$EMBED_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
volumes:
  heky_data:
  ollama_models:
